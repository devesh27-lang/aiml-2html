<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <fieldset> <!--border-->
        <legend>bio data</legend><!--caption-->
        <form action="./response.html"><!--attribute for form(name ,target,method(get is attribute of method),)   -->
            <label for="name">user name:</label>
            <input type="text" name="name" id="name" placeholder="enter your name" required>
            <br><br>
            <label for="pass">password:</label>
            <input type="password" name="pass" id="pass" >
            <br><br>
            <label for="dob">dob:</label>
            <input type="date" name="dob" id="dob">
            <br><br>
            <label for="gender">gender:</label>
            <input type="radio" name="gender" id="gender"><label for="gender">female</label>
            <input type="radio" name="gender" id="gender"><label for="gender">male</label>
            <br><br>
            <label for="hobb">hobb:</label>
            <input type="checkbox"  name="hobb1" id="hobb"><label for="hobb">cricket</label>
            <input type="checkbox"  name="hobb2" id="hobb"><label for="hobb">football</label>
            <br><br>
            <label for="add">address:</label>
            <textarea name="add" id="add"></textarea>
            <br><br>
            <label for="tel">phone:</label>
            <input type="tel" name="tel" id="tel">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br><br>
            <label for="att">Attempt:</label>
            <input type="number" name="att" id="att">
            <br><br>
            <label for="url">Homepage:</label>
            <input type="url" name="url" id="url">
            <br><br>
            <label for="file">Resume upload:</label>
            <input type="file" name="file" id="name">
            <br><br>
            <input type="submit"value=book now>
            <input type="reset" value="reser form">
            <br><br>
            <label for="lang">select language:</label>
            <select name="lang" id="lang">
                <option value="select">select</option>
                <option value="c">c</option>
                <option value="c++">c++</option>
                <option value="java">java</option>
                <option value="python">python</option>
            </select>
            <br><br>


            

        </form>



    </fieldset>

    
</body>
</html>
